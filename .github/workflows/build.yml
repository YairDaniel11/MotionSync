name: Build MotionSync

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (exe + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --clean --name MotionSync main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0-dev' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version packaging\windows-installer.iss

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionSync-Windows-exe
          path: dist/MotionSync.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionSync-Windows-Installer
          path: dist/Output/*.exe

  build-macos:
    name: macOS (${{ matrix.arch }})
    # macos-13 הוצא משירות; ל-Intel משתמשים ב-macos-15-intel (ראנר x86_64 אמיתי).
    # אי אפשר לבנות Intel מתוך ראנר arm64: ל-PyQt5 אין wheels ל-x86_64/universal2,
    # ולכן PyInstaller נכשל ב-COLLECT עם IncompatibleBinaryArchError.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Intel
            runner: macos-15-intel
            python-arch: x64
          - arch: AppleSilicon
            runner: macos-14
            python-arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-arch }}

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build app bundle
        run: >
          pyinstaller --windowed --clean --name MotionSync
          --osx-bundle-identifier com.yairdaniel.motionsync main.py

      - name: Add camera usage description to Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'MotionSync uses the camera to detect vehicle motion locally. No video is stored or transmitted.'" dist/MotionSync.app/Contents/Info.plist

      - name: Zip app bundle
        run: |
          cd dist
          zip -r -y MotionSync-macOS-${{ matrix.arch }}.zip MotionSync.app

      # DMG עם קיצור דרך ל-Applications — חוויית ההתקנה הרגילה ב-macOS.
      - name: Build DMG installer
        run: |
          mkdir -p dmg-stage
          cp -R dist/MotionSync.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname MotionSync -srcfolder dmg-stage -ov -format UDZO \
            dist/MotionSync-macOS-${{ matrix.arch }}.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionSync-macOS-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Attach files to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
          generate_release_notes: true
